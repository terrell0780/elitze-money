<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elitze Money Engine</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121820; --panel2: #18202c; --line: #243040;
    --text: #e7edf5; --muted: #93a1b5; --accent: #37d67a; --accent2: #4c9aff;
    --bad: #ff5d6c; --warn: #ffb648; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 22px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; font-family: var(--mono); }
  .positive { color: var(--accent); } .negative { color: var(--bad); }
  h2 { font-size: 15px; margin: 30px 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; align-items: center; }
  form input, form select, form button { font-size: 14px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  form button { background: var(--accent); color: #04120a; border: none; font-weight: 600; cursor: pointer; }
  form button.secondary { background: var(--accent2); color: #03101f; }
  form label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .pill { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.promoted { background: rgba(55,214,122,.15); color: var(--accent); }
  .pill.killed { background: rgba(255,93,108,.15); color: var(--bad); }
  .pill.other { background: rgba(76,154,255,.15); color: var(--accent2); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--line);
    padding: 12px 16px; border-radius: 10px; font-size: 13px; display: none; max-width: 420px; }
</style>
</head>
<body>
<header>
  <h1>Elitze Money Engine</h1>
  <span class="sub">autonomous revenue experimentation · real execution only</span>
</header>
<main>
  <div class="grid">
    <div class="card"><div class="label">Reinvestment pool</div><div class="value" id="pool">—</div></div>
    <div class="card"><div class="label">Verified revenue</div><div class="value positive" id="revenue">—</div></div>
    <div class="card"><div class="label">Experiments</div><div class="value" id="count">—</div></div>
    <div class="card"><div class="label">Promoted</div><div class="value" id="promoted">—</div></div>
  </div>

  <h2>Run experiment</h2>
  <form id="runForm">
    <select id="engine" required>
      <option value="lead_generation">Lead generation</option>
      <option value="b2b_services">B2B services</option>
      <option value="digital_products">Digital products</option>
      <option value="affiliate_marketing">Affiliate marketing</option>
      <option value="market_intelligence">Market intelligence</option>
      <option value="saas">SaaS</option>
    </select>
    <input id="title" placeholder="Experiment title" value="Untitled experiment" />
    <input id="rollback" placeholder="Rollback plan (required to promote)" style="min-width:260px" />
    <label><input type="checkbox" id="paper" /> paper (simulated)</label>
    <button type="submit">Run</button>
    <button type="button" class="secondary" id="seedBtn">Seed $1000</button>
  </form>

  <h2>Experiments</h2>
  <table>
    <thead>
      <tr><th>Status</th><th>Engine</th><th>Title</th>
        <th class="num">Spend</th><th class="num">Revenue</th><th class="num">Profit</th><th class="num">ROI</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" style="color:var(--muted)">Loading…</td></tr></tbody>
  </table>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 5000); }
function fmt(n) { return n == null ? "—" : Number(n).toFixed(2); }
async function refresh() {
  try {
    const [pool, exps] = await Promise.all([
      fetch("/pool").then(r => r.json()),
      fetch("/experiments?limit=100").then(r => r.json()),
    ]);
    $("pool").textContent = fmt(pool.balance);
    $("revenue").textContent = fmt(pool.verified_revenue);
    $("count").textContent = exps.length;
    $("promoted").textContent = exps.filter(e => e.promotion_status === "promoted").length;
    const rows = exps.map(e => {
      const pill = e.promotion_status === "promoted" ? "promoted"
        : (e.promotion_status === "killed" ? "killed" : "other");
      const roi = e.roi == null ? "—" : Number(e.roi).toFixed(1) + "%";
      const profit = Number(e.profit);
      return `<tr>
        <td><span class="pill ${pill}">${e.status}</span></td>
        <td>${e.engine}</td><td>${e.title}</td>
        <td class="num">${fmt(e.execution_cost)}</td>
        <td class="num">${fmt(e.revenue)}</td>
        <td class="num ${profit >= 0 ? "positive" : "negative"}">${fmt(e.profit)}</td>
        <td class="num">${roi}</td></tr>`;
    }).join("");
    $("rows").innerHTML = rows || '<tr><td colspan="7" style="color:var(--muted)">No experiments yet.</td></tr>';
  } catch (e) { toast("Error loading data: " + e); }
}
$("runForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {
    engine: $("engine").value,
    title: $("title").value || "Untitled experiment",
    mode: $("paper").checked ? "paper" : "real",
    rollback_plan: $("rollback").value || "",
  };
  toast("Running experiment…");
  try {
    const r = await fetch("/experiments/run", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) { toast("Run failed: " + JSON.stringify(data.detail || data)); }
    else { toast(`Experiment ${data.id.slice(0, 8)} → ${data.status} (profit ${fmt(data.profit)}, roi ${data.roi ?? "—"}%)`); }
    refresh();
  } catch (e) { toast("Run failed: " + e); }
});
$("seedBtn").addEventListener("click", async () => {
  try {
    await fetch("/pool/seed", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ amount: 1000 }) });
    toast("Seeded $1000 into the pool."); refresh();
  } catch (e) { toast("Seed failed: " + e); }
});
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
